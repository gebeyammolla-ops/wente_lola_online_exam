

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wonte Lola School Exam System</title>
<style>
body{font-family:Arial;background:#eef2f7;margin:0}
header{background:#123b70;color:white;text-align:center;padding:20px}
.box{background:white;padding:22px;margin:20px auto;max-width:450px;border-radius:12px;box-shadow:0 2px 8px #bbb}
input,select,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{background:#123b70;color:white;border:0;border-radius:6px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h2>WONTE LOLA SCHOOL</h2>
<p>Online Examination System</p>
</header>

<div class="box" id="home">
<h2>Select Login Type</h2>
<button onclick="showLogin('Admin')">Admin Login</button>
<button onclick="showLogin('Teacher')">Teacher Login</button>
<button onclick="showLogin('Student')">Student Login</button>
</div>

<div class="box hidden" id="login">
<h2 id="loginTitle"></h2>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="goHome()">Back</button>
<p id="msg"></p>
</div>

<div class="box hidden" id="dashboard">
<h2 id="dashTitle"></h2>
<p id="welcome"></p>


<div id="studentArea" class="hidden">
<h3>Take Examination</h3>
<button onclick="showMyHistory()">My Exam History</button>
<div id="myHistory"></div>
<label>Grade</label>
<select id="studentGrade">
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>
</select>

<label>Subject</label>
<select id="studentSubject">
<option>Mathematics</option>
<option>English</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>
<option>ICT</option>
</select>

<button onclick="loadExam()">Load Exam</button>
  

<p id="timer" style="font-size:20px;color:red;font-weight:bold;"></p>

<div id="examQuestions"></div>
<button onclick="submitRealExam()">Submit Exam</button>
<p id="studentResult"></p>
</div>

<div id="adminArea" class="hidden">

<h2>Admin Dashboard</h2>

<p id="totalStudents">Total Students: 0</p>

<p id="totalTeachers">Total Teachers: 0</p>

<p id="totalQuestions">Total Questions: 0</p>

<p id="totalExams">Total Exams: 0</p>

<button onclick="showResults()">View All Results</button>

<div id="adminResults"></div>
  <h3>Manage Teachers</h3>

<label>Teacher Username</label>
<input id="teacherUsername" placeholder="Enter username">

<label>Teacher Password</label>
<input id="teacherPassword" type="password" placeholder="Enter password">

<button onclick="addTeacher()">Register Teacher</button>

<p id="teacherMsg"></p>

<div id="teacherList"></div>
  

<h3>Manage Students</h3><label>Student Username</label>
  <input id="studentUsername" placeholder="Enter username">
  <label>Student Password</label><input id="studentPassword" 
   type="password" placeholder="Enter password">
  <label>Student Grade</label><select id="studentRegGrade">
  <option>Grade 9</option><option>Grade 10</option><option>Grade 11</option>
    <option>Grade 12</option></select><button onclick="addStudent()">Register Student</button>
  <p id="studentMsg"></p><div id="studentList"></div>

</div>
  

<div id="staffArea" class="hidden">
<h3>Question Management</h3>

<label>Grade</label>
<select id="qGrade">
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>
</select>

<label>Subject</label>
<select id="qSubject">
<option>Mathematics</option>
<option>English</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>
<option>ICT</option>
</select>

<input id="question" placeholder="Enter question">

<input id="optA" placeholder="Option A">
<input id="optB" placeholder="Option B">
<input id="optC" placeholder="Option C">
<input id="optD" placeholder="Option D">

<label>Correct Answer</label>
<select id="correct">
<option value="A">Option A</option>
<option value="B">Option B</option>
<option value="C">Option C</option>
<option value="D">Option D</option>
</select>

<button onclick="saveQuestion()">Save Question</button>
  <button onclick="showMyQuestions()">My Questions</button>
<div id="myQuestions"></div>
<p id="saveMsg"></p>

<button onclick="showResults()">View Results</button>
<div id="resultsList"></div>
  
<button onclick="showTeacherResults()">Student Results</button>
<div id="teacherResults"></div>

</div>

<button onclick="goHome()">Logout</button>
</div>

<div class="box hidden" id="exam">
<h2>Sample Examination</h2>
<p>1. What does CPU stand for?</p>
<label><input type="radio" name="q1" value="a"> Central Processing Unit</label>
<label><input type="radio" name="q1" value="b"> Computer Personal Unit</label>
<button onclick="submitExam()">Submit Exam</button>
<p id="result"></p>
</div>


  
<script>
let role="";
function showLogin(r){
  let currentUser="";
role=r;
document.getElementById("home").classList.add("hidden");
document.getElementById("login").classList.remove("hidden");
document.getElementById("loginTitle").innerText=r+" Login";
}
function addTeacher(){

let username=document.getElementById("teacherUsername").value.trim();
let password=document.getElementById("teacherPassword").value;

if(!username||!password){
alert("Enter teacher username and password");
return;
}

let teachers=JSON.parse(localStorage.getItem("teachers")||"[]");

teachers.push({
username:username,
password:password
});

localStorage.setItem("teachers",JSON.stringify(teachers));

document.getElementById("teacherMsg").innerText=
"Teacher Registered Successfully!";

document.getElementById("teacherUsername").value="";
document.getElementById("teacherPassword").value="";

showTeachers();

}
  function showTeachers(){

let teachers=JSON.parse(localStorage.getItem("teachers")||"[]");

let html="<h4>Registered Teachers</h4>";

html+="<table border='1'>";
html+="<tr><th>Username</th><th>Action</th></tr>";

teachers.forEach((t,i)=>{

html+="<tr>";
html+="<td>"+t.username+"</td>";
html+="<td><button onclick='deleteTeacher("+i+")'>Delete</button></td>";
html+="</tr>";

});

html+="</table>";

document.getElementById("teacherList").innerHTML=html;

}
  function deleteTeacher(index){

let teachers=JSON.parse(localStorage.getItem("teachers")||"[]");

if(confirm("Delete this teacher?")){

teachers.splice(index,1);

localStorage.setItem("teachers",JSON.stringify(teachers));

showTeachers();

}

}
  
function addStudent(){
  let username=document.getElementById("studentUsername").value.trim();
  let password=document.getElementById("studentPassword").value;
  let grade=document.getElementById("studentRegGrade").value;

  if(!username||!password){
    alert("Enter student username and password");
    return;
  }

  let students=JSON.parse(localStorage.getItem("students")||"[]");

  students.push({
    username:username,
    password:password,
    grade:grade
  });

  localStorage.setItem("students",JSON.stringify(students));

  document.getElementById("studentMsg").innerText="Student Registered Successfully!";
  document.getElementById("studentUsername").value="";
  document.getElementById("studentPassword").value="";

  showStudents();
}

function showStudents(){
  let students=JSON.parse(localStorage.getItem("students")||"[]");
  let html="<h4>Registered Students</h4>";

  html+="<table border='1'>";
  html+="<tr><th>Username</th><th>Grade</th><th>Action</th></tr>";

  students.forEach((s,i)=>{
    html+="<tr>";
    html+="<td>"+s.username+"</td>";
    html+="<td>"+s.grade+"</td>";
    html+="<td><button onclick='deleteStudent("+i+")'>Delete</button></td>";
    html+="</tr>";
  });

  html+="</table>";
  document.getElementById("studentList").innerHTML=html;
}

function deleteStudent(index){
  let students=JSON.parse(localStorage.getItem("students")||"[]");

  if(confirm("Delete this student?")){
    students.splice(index,1);
    localStorage.setItem("students",JSON.stringify(students));
    showStudents();
  }
}

  
function updateAdminDashboard(){

let questions=JSON.parse(localStorage.getItem("questions")||"[]");
let results=JSON.parse(localStorage.getItem("examResults")||"[]");

document.getElementById("totalStudents").innerText=
"Total Students: "+new Set(results.map(r=>r.student)).size;

document.getElementById("totalTeachers").innerText=
"Total Teachers: 0";

document.getElementById("totalQuestions").innerText=
"Total Questions: "+questions.length;

document.getElementById("totalExams").innerText=
"Total Exams: "+results.length;

}
  
function login(){
let u=document.getElementById("username").value.trim();
  currentUser=u;
let p=document.getElementById("password").value;
  
if(role==="Student"){
  let students=JSON.parse(localStorage.getItem("students")||"[]");
  let validStudent=students.find(s=>s.username===u&&s.password===p);
  if(!validStudent){
  document.getElementById("msg").innerText="Invalid Student Username or Password";
  return;
  }
  currentUser=validStudent.username;
  document.getElementById("studentGrade").value=validStudent.grade;
document.getElementById("studentGrade").disabled=true;
}

  if(role==="Teacher"){

let teachers=JSON.parse(localStorage.getItem("teachers")||"[]");

let validTeacher=teachers.find(t=>t.username===u && t.password===p);

if(!validTeacher){

document.getElementById("msg").innerText="Invalid Teacher Username or Password";

return;

}

}
if(!u||!p){document.getElementById("msg").innerText="Enter username and password";return;}
document.getElementById("login").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
document.getElementById("dashTitle").innerText=role+" Dashboard";
  if(role==="Admin"){
updateAdminDashboard();
showTeachers();
}
document.getElementById("welcome").innerText="Welcome "+u;
  if(role==="Admin"){
document.getElementById("adminArea").classList.remove("hidden");
}else if(role==="Student"){
document.getElementById("studentArea").classList.remove("hidden");
}else{
document.getElementById("staffArea").classList.remove("hidden");
}
if(role==="Student"){
document.getElementById("studentArea").classList.remove("hidden");
}else{
document.getElementById("staffArea").classList.remove("hidden");
}
}
function startExam(){
document.getElementById("dashboard").classList.add("hidden");
document.getElementById("exam").classList.remove("hidden");
}
function submitExam(){
let a=document.querySelector('input[name="q1"]:checked');
let score=a&&a.value==="a"?1:0;
document.getElementById("result").innerText="Score: "+score+"/1";
}
function goHome(){
location.reload();
}
  
let questions = JSON.parse(localStorage.getItem("questions") || "[]");

function saveQuestion(){
let q = {
grade: document.getElementById("qGrade").value,
subject: document.getElementById("qSubject").value,
question: document.getElementById("question").value,
A: document.getElementById("optA").value,
B: document.getElementById("optB").value,
C: document.getElementById("optC").value,
D: document.getElementById("optD").value,
correct: document.getElementById("correct").value
};

if(!q.question || !q.A || !q.B || !q.C || !q.D){
document.getElementById("saveMsg").innerText="Please fill all fields!";
return;
}

questions.push(q);
localStorage.setItem("questions",JSON.stringify(questions));

document.getElementById("saveMsg").innerText="Question saved successfully!";
}

function showMyQuestions(){

let allQuestions=JSON.parse(localStorage.getItem("questions")||"[]");

let html="<h3>My Questions</h3>";

if(allQuestions.length===0){
html+="<p>No questions available!</p>";
}else{

allQuestions.forEach((q,i)=>{

html+=`<p><b>${i+1}. ${q.question}</b><br>`;
html+=`Grade: ${q.grade}<br>`;
html+=`Subject: ${q.subject}<br>`;
html+=`Correct Answer: ${q.correct}</p>`;
html+="<hr>";

});

}

document.getElementById("myQuestions").innerHTML=html;

}

  
function loadExam(){
let grade=document.getElementById("studentGrade").value;
let subject=document.getElementById("studentSubject").value;

let questions=JSON.parse(localStorage.getItem("questions")||"[]");

let selected=questions.filter(q=>q.grade===grade&&q.subject===subject);

let html="";

selected.forEach((q,i)=>{
html+=`<p><b>${i+1}. ${q.question}</b></p>`;
html+=`<label><input type="radio" name="exam${i}" value="A"> ${q.A}</label><br>`;
html+=`<label><input type="radio" name="exam${i}" value="B"> ${q.B}</label><br>`;
html+=`<label><input type="radio" name="exam${i}" value="C"> ${q.C}</label><br>`;
html+=`<label><input type="radio" name="exam${i}" value="D"> ${q.D}</label><br>`;
});

document.getElementById("examQuestions").innerHTML=selected.length?html:"No questions available!";

startTimer();
}


function submitRealExam(){

let questions=JSON.parse(localStorage.getItem("questions")||"[]");

let grade=document.getElementById("studentGrade").value;
let subject=document.getElementById("studentSubject").value;

let selected=questions.filter(q=>q.grade===grade&&q.subject===subject);

let student=currentUser;

let submitted=JSON.parse(localStorage.getItem("submittedExams")||"[]");

let alreadySubmitted=submitted.some(e=>e.student===student&&e.grade===grade&&e.subject===subject);

if(alreadySubmitted){
document.getElementById("studentResult").innerText="You have already submitted this exam!";
return;
}

if(selected.length===0){
document.getElementById("studentResult").innerText="No questions available!";
return;
}

let score=0;

selected.forEach((q,i)=>{
let answer=document.querySelector('input[name="exam'+i+'"]:checked');
if(answer&&answer.value===q.correct)score++;
});

document.getElementById("studentResult").innerText="Your Score: "+score+"/"+selected.length;

saveExamResult(grade,subject,score,selected.length);
  let reviewHTML="<h3>Exam Review</h3>";

selected.forEach((q,i)=>{
let answer=document.querySelector('input[name="exam'+i+'"]:checked');

let chosen=answer?answer.value:"No Answer";

reviewHTML+=`<p><b>${i+1}. ${q.question}</b></p>`;
reviewHTML+=`<p>Your Answer: ${chosen} - ${answer?q[chosen]:"No Answer"}</p>`;
reviewHTML+=`<p>Correct Answer: ${q.correct} - ${q[q.correct]}</p>`;
reviewHTML+="<hr>";
});

let review=document.getElementById("examReview");

if(!review){
review=document.createElement("div");
review.id="examReview";
document.getElementById("studentResult").after(review);
}

review.innerHTML=reviewHTML;

submitted.push({student:student,grade:grade,subject:subject});

localStorage.setItem("submittedExams",JSON.stringify(submitted));

document.querySelectorAll('#examQuestions input').forEach(input=>input.disabled=true);

}


let examTime = 60 * 60;
let timerInterval;

function startTimer(){

clearInterval(timerInterval);
examTime = 60 * 60;

document.getElementById("timer").innerText = "Time Left: 60:00";


timerInterval = setInterval(function(){
let minutes = Math.floor(examTime / 60);
let seconds = examTime % 60;

document.getElementById("timer").innerText =
"Time Left: " +
minutes + ":" + String(seconds).padStart(2,"0");

examTime--;

if(examTime < 0){
clearInterval(timerInterval);
submitRealExam();
}
},1000);
}
function showResults(){

let results=JSON.parse(localStorage.getItem("examResults")||"[]");
let html="<h3>Student Results</h3>";

html+="<label>Filter by Grade:</label>";
html+="<select id='filterGrade' onchange='filterResults()'>";
html+="<option value='All'>All Grades</option>";
html+="<option>Grade 9</option>";
html+="<option>Grade 10</option>";
html+="<option>Grade 11</option>";
html+="<option>Grade 12</option>";
html+="</select>";

html+="<label>Filter by Subject:</label>";
html+="<select id='filterSubject' onchange='filterResults()'>";
html+="<option value='All'>All Subjects</option>";
html+="<option>Mathematics</option>";
html+="<option>English</option>";
html+="<option>Physics</option>";
html+="<option>Chemistry</option>";
html+="<option>Biology</option>";
html+="<option>ICT</option>";
html+="</select>";

if(results.length===0){

html+="<p>No results yet</p>";

}else{

html+="<table border='1'>";

html+="<tr><th>Student</th><th>Grade</th><th>Subject</th><th>Score</th><th>Date</th></tr>";

results.forEach(r=>{

html+="<tr>";

html+="<td>"+r.student+"</td>";
html+="<td>"+r.grade+"</td>";
html+="<td>"+r.subject+"</td>";
html+="<td>"+r.score+"/"+r.total+"</td>";
html+="<td>"+r.date+"</td>";

html+="</tr>";

});

html+="</table>";

}
html+="<br><button onclick='window.print()'>Print Results</button>";
  html+="<br><button onclick='exportResults()'>Export Results to Excel</button>";
document.getElementById("resultsList").innerHTML=html;

}
function exportResults(){

let rows=document.querySelectorAll("#resultsList table tr");

if(rows.length<=1){
alert("No results available to export!");
return;
}

let csv=[];

rows.forEach((row,index)=>{

if(index===0 || row.style.display!=="none"){

let cells=row.querySelectorAll("th,td");

let data=[];

cells.forEach(cell=>{
let value=cell.innerText.replace(/"/g,'""');
data.push('"'+value+'"');
});

csv.push(data.join(","));

}

});

let file=new Blob(["\uFEFF"+csv.join("\n")],{
type:"text/csv;charset=utf-8;"
});

let link=document.createElement("a");
link.href=URL.createObjectURL(file);
link.download="Student_Results.csv";
link.click();

URL.revokeObjectURL(link.href);

}
  
  function filterResults(){

let grade=document.getElementById("filterGrade").value;
let subject=document.getElementById("filterSubject").value;

let rows=document.querySelectorAll("#resultsList table tr");

for(let i=1;i<rows.length;i++){

let rowGrade=rows[i].cells[1].innerText;
let rowSubject=rows[i].cells[2].innerText;

if((grade==="All" || rowGrade===grade) &&
(subject==="All" || rowSubject===subject)){

rows[i].style.display="";

}else{

rows[i].style.display="none";

}

}

}

function saveExamResult(grade, subject, score, total){

let examResults = JSON.parse(localStorage.getItem("examResults") || "[]");

let result = {
student: currentUser,
grade: grade,
subject: subject,
score: score,
total: total,
date: new Date().toLocaleDateString()
};

examResults.push(result);

localStorage.setItem("examResults", JSON.stringify(examResults));

}
  function showMyHistory(){

let results=JSON.parse(localStorage.getItem("examResults")||"[]");

let myResults=results.filter(r=>r.student===currentUser);

let html="<h3>My Exam History</h3>";

if(myResults.length===0){
html+="<p>No exam history available.</p>";
}else{

myResults.forEach((r,i)=>{
html+=`<p><b>${i+1}. ${r.subject}</b><br>`;
html+=`Grade: ${r.grade}<br>`;
html+=`Score: ${r.score}/${r.total}<br>`;
html+=`Date: ${r.date}</p><hr>`;
});

}

document.getElementById("myHistory").innerHTML=html;

}

</script>
</body>
</html>
