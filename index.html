
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wente Lola School Exam System</title>

<style>
body {
  font-family: Arial;
  background: #eef3f8;
  margin: 0;
}
header {
  background: #123b70;
  color: white;
  text-align: center;
  padding: 25px;
}
main {
  max-width: 500px;
  margin: 30px auto;
  padding: 20px;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 3px 10px #ccc;
}
input, select, button {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  box-sizing: border-box;
  border-radius: 8px;
}
button {
  background: #1764b0;
  color: white;
  border: none;
  font-size: 16px;
}
.hidden { display: none; }
</style>
</head>

<body>

<header>
<h2>Wente Lola School Exam System</h2>
<p>Welcome Students</p>
<p>Online Exam Portal</p>
</header>

<main>
<div class="card" id="login">
<h2>Student Login</h2>

<input id="username" placeholder="Student Username">
<input id="password" type="password"
placeholder="Student Password">

<button onclick="loginStudent()">Login</button>

<p id="message"></p>
</div>

<div class="card hidden" id="portal">
<h2>Welcome Student!</h2>

<label>Select Grade</label>
<select id="grade">
<option>Grade 7</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>
</select>

<label>Select Subject</label>
<select id="subject">
<option>Mathematics</option>
<option>English</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>
<option>ICT</option>
</select>

<button onclick="startExam()">Start Exam</button>
</div>

<div class="card hidden" id="exam">
<h2>Sample Examination</h2>
<p>1. Which one is an input device?</p>
<label><input type="radio" name="q1" value="A"> Monitor</label>
<label><input type="radio" name="q1" value="B"> Keyboard</label>
<label><input type="radio" name="q1" value="C"> Printer</label>

<button onclick="submitExam()">Submit Exam</button>
</div>

<div class="card hidden" id="result">
<h2>Exam Result</h2>
<p id="score"></p>
</div>
</main>

<script>
function loginStudent() {
  let u = document.getElementById("username").value;
  let p = document.getElementById("password").value;

  if (u !== "" && p !== "") {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("portal").classList.remove("hidden");
  } else {
    document.getElementById("message").innerText =
      "Enter username and password.";
  }
}

function startExam() {
  document.getElementById("portal").classList.add("hidden");
  document.getElementById("exam").classList.remove("hidden");
}

function submitExam() {
  let answer = document.querySelector('input[name="q1"]:checked');
  let score = answer && answer.value === "B" ? 1 : 0;

  document.getElementById("exam").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("score").innerText =
    "Your Score: " + score + " / 1";
}
</script>

</body>
</html>
