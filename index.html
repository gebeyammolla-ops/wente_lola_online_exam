
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wonte Lola School Exam System</title>
<style>
body{font-family:Arial;background:#eef2f7;margin:0}
header{background:#123b70;color:white;padding:20px;text-align:center}
.box{background:white;padding:25px;margin:25px auto;
max-width:450px;border-radius:12px;box-shadow:0 3px 12px #bbb}
input,select,button{width:100%;padding:12px;margin:8px 0;
box-sizing:border-box;font-size:16px}
button{background:#123b70;color:white;border:0;border-radius:6px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h2>WONTE LOLA SCHOOL</h2>
<p>Online Examination System</p>
</header>

<div class="box" id="login">
<h2>Student Login</h2>
<input id="username" placeholder="Student Username">
<input id="password" type="password" placeholder="Password">
<button onclick="loginStudent()">Login</button>
<p id="message"></p>
</div>

<div class="box hidden" id="dashboard">
<h2>Student Dashboard</h2>
<p id="welcome"></p>
<label>Grade</label>
<select id="grade">
<option>Grade 7</option><option>Grade 8</option>
<option>Grade 9</option><option>Grade 10</option>
<option>Grade 11</option><option>Grade 12</option>
</select>
<label>Subject</label>
<select id="subject">
<option>ICT</option><option>Mathematics</option>
<option>English</option><option>Biology</option>
<option>Chemistry</option><option>Physics</option>
</select>
<button onclick="startExam()">Start Exam</button>
</div>

<div class="box hidden" id="exam">
<h2>ICT Sample Exam</h2>
<p>1. What does CPU stand for?</p>
<label><input type="radio" name="q1" value="a"> Central Processing Unit</label>
<label><input type="radio" name="q1" value="b"> Computer Personal Unit</label>
<button onclick="submitExam()">Submit Exam</button>
<p id="result"></p>
</div>

<script>
function loginStudent(){
let u=document.getElementById("username").value.trim();
let p=document.getElementById("password").value;
if(u===""||p===""){
document.getElementById("message").innerText="Enter username and password";
return;
}
document.getElementById("login").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
document.getElementById("welcome").innerText="Welcome, "+u;
}
function startExam(){
document.getElementById("dashboard").classList.add("hidden");
document.getElementById("exam").classList.remove("hidden");
}
function submitExam(){
let a=document.querySelector('input[name="q1"]:checked');
let score=a&&a.value==="a"?1:0;
document.getElementById("result").innerText=
"Your score: "+score+"/1";
}
</script>
</body>
</html>
