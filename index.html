

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wonte Lola School Exam System</title>
<style>
body{font-family:Arial;background:#eef2f7;margin:0}
header{background:#123b70;color:white;text-align:center;padding:20px}
.box{background:white;padding:22px;margin:20px auto;max-width:450px;border-radius:12px;box-shadow:0 2px 8px #bbb}
input,select,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{background:#123b70;color:white;border:0;border-radius:6px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h2>WONTE LOLA SCHOOL</h2>
<p>Online Examination System</p>
</header>

<div class="box" id="home">
<h2>Select Login Type</h2>
<button onclick="showLogin('Admin')">Admin Login</button>
<button onclick="showLogin('Teacher')">Teacher Login</button>
<button onclick="showLogin('Student')">Student Login</button>
</div>

<div class="box hidden" id="login">
<h2 id="loginTitle"></h2>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="goHome()">Back</button>
<p id="msg"></p>
</div>

<div class="box hidden" id="dashboard">
<h2 id="dashTitle"></h2>
<p id="welcome"></p>


<div id="studentArea" class="hidden">
<h3>Take Examination</h3>

<label>Grade</label>
<select id="studentGrade">
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>
</select>

<label>Subject</label>
<select id="studentSubject">
<option>Mathematics</option>
<option>English</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>
<option>ICT</option>
</select>

<button onclick="loadExam()">Load Exam</button>
  

<p id="timer" style="font-size:20px;color:red;font-weight:bold;"></p>

<div id="examQuestions"></div>
<button onclick="submitRealExam()">Submit Exam</button>
<p id="studentResult"></p>
</div>


  

<div id="staffArea" class="hidden">
<h3>Question Management</h3>

<label>Grade</label>
<select id="qGrade">
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>
</select>

<label>Subject</label>
<select id="qSubject">
<option>Mathematics</option>
<option>English</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>
<option>ICT</option>
</select>

<input id="question" placeholder="Enter question">

<input id="optA" placeholder="Option A">
<input id="optB" placeholder="Option B">
<input id="optC" placeholder="Option C">
<input id="optD" placeholder="Option D">

<label>Correct Answer</label>
<select id="correct">
<option value="A">Option A</option>
<option value="B">Option B</option>
<option value="C">Option C</option>
<option value="D">Option D</option>
</select>

<button onclick="saveQuestion()">Save Question</button>
<p id="saveMsg"></p>

  <button onclick="showResults()">View Results</button>

<div id="resultsList"></div>
</div>

<button onclick="goHome()">Logout</button>
</div>

<div class="box hidden" id="exam">
<h2>Sample Examination</h2>
<p>1. What does CPU stand for?</p>
<label><input type="radio" name="q1" value="a"> Central Processing Unit</label>
<label><input type="radio" name="q1" value="b"> Computer Personal Unit</label>
<button onclick="submitExam()">Submit Exam</button>
<p id="result"></p>
</div>

<script>
let role="";
function showLogin(r){
role=r;
document.getElementById("home").classList.add("hidden");
document.getElementById("login").classList.remove("hidden");
document.getElementById("loginTitle").innerText=r+" Login";
}
function login(){
let u=document.getElementById("username").value.trim();
let p=document.getElementById("password").value;
if(!u||!p){document.getElementById("msg").innerText="Enter username and password";return;}
document.getElementById("login").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
document.getElementById("dashTitle").innerText=role+" Dashboard";
document.getElementById("welcome").innerText="Welcome "+u;
if(role==="Student"){
document.getElementById("studentArea").classList.remove("hidden");
}else{
document.getElementById("staffArea").classList.remove("hidden");
}
}
function startExam(){
document.getElementById("dashboard").classList.add("hidden");
document.getElementById("exam").classList.remove("hidden");
}
function submitExam(){
let a=document.querySelector('input[name="q1"]:checked');
let score=a&&a.value==="a"?1:0;
document.getElementById("result").innerText="Score: "+score+"/1";
}
function goHome(){
location.reload();
}
  
let questions = JSON.parse(localStorage.getItem("questions") || "[]");

function saveQuestion(){
let q = {
grade: document.getElementById("qGrade").value,
subject: document.getElementById("qSubject").value,
question: document.getElementById("question").value,
A: document.getElementById("optA").value,
B: document.getElementById("optB").value,
C: document.getElementById("optC").value,
D: document.getElementById("optD").value,
correct: document.getElementById("correct").value
};

if(!q.question || !q.A || !q.B || !q.C || !q.D){
document.getElementById("saveMsg").innerText="Please fill all fields!";
return;
}

questions.push(q);
localStorage.setItem("questions",JSON.stringify(questions));

document.getElementById("saveMsg").innerText="Question saved successfully!";
}

  
function loadExam(){
let grade=document.getElementById("studentGrade").value;
let subject=document.getElementById("studentSubject").value;

let questions=JSON.parse(localStorage.getItem("questions")||"[]");

let selected=questions.filter(q=>q.grade===grade&&q.subject===subject);

let html="";

selected.forEach((q,i)=>{
html+=`<p><b>${i+1}. ${q.question}</b></p>`;
html+=`<label><input type="radio" name="exam${i}" value="A"> ${q.A}</label><br>`;
html+=`<label><input type="radio" name="exam${i}" value="B"> ${q.B}</label><br>`;
html+=`<label><input type="radio" name="exam${i}" value="C"> ${q.C}</label><br>`;
html+=`<label><input type="radio" name="exam${i}" value="D"> ${q.D}</label><br>`;
});

document.getElementById("examQuestions").innerHTML=
selected.length?html:"No questions available!"

  document.getElementById("examQuestions").innerHTML=
selected.length?html:"No questions available!";

startTimer();
}

function submitRealExam(){
let questions=JSON.parse(localStorage.getItem("questions")||"[]");

let grade=document.getElementById("studentGrade").value;
let subject=document.getElementById("studentSubject").value;

let selected=questions.filter(q=>q.grade===grade&&q.subject===subject);
let score=0;

selected.forEach((q,i)=>{
let answer=document.querySelector('input[name="exam'+i+'"]:checked');
if(answer&&answer.value===q.correct)score++;
});

document.getElementById("studentResult").innerText=
"Your Score: "+score+"/"+selected.length;
}

let examTime = 60 * 60;
let timerInterval;

function startTimer(){

clearInterval(timerInterval);
examTime = 60 * 60;

document.getElementById("timer").innerText = "Time Left: 60:00";


timerInterval = setInterval(function(){
let minutes = Math.floor(examTime / 60);
let seconds = examTime % 60;

document.getElementById("timer").innerText =
"Time Left: " +
minutes + ":" + String(seconds).padStart(2,"0");

examTime--;

if(examTime < 0){
clearInterval(timerInterval);
submitRealExam();
}
},1000);
}
function showResults(){

let results=JSON.parse(localStorage.getItem("examResults")||"[]");

let html="<h3>Student Results</h3>";

if(results.length===0){

html+="<p>No results yet</p>";

}else{

html+="<table border='1'>";

html+="<tr><th>Student</th><th>Grade</th><th>Subject</th><th>Score</th><th>Date</th></tr>";

results.forEach(r=>{

html+="<tr>";

html+="<td>"+r.student+"</td>";
html+="<td>"+r.grade+"</td>";
html+="<td>"+r.subject+"</td>";
html+="<td>"+r.score+"/"+r.total+"</td>";
html+="<td>"+r.date+"</td>";

html+="</tr>";

});

html+="</table>";

}

document.getElementById("resultsList").innerHTML=html;

}

</script>
</body>
</html>
